<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Thomas Kunnumpurath — VP of Systems Engineering at Solace. Event-driven architecture, cloud-native platforms, and engineering leadership." />
		<meta name="keywords" content="Thomas Kunnumpurath, TKTheTechie, Systems Engineering, Event Driven Architecture, Solace, Kafka, Technical Leadership" />
		<meta name="author" content="Thomas Kunnumpurath" />
		<meta name="color-scheme" content="light dark" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<meta property="og:type" content="website" />
		<meta property="og:title" content="Thomas Kunnumpurath — VP Systems Engineering" />
		<meta property="og:description" content="Technical leader specialising in event-driven architecture, cloud-native platforms, and scaling engineering teams." />
		<meta property="og:image" content="/profile-pic.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:creator" content="@tkthetechie" />

		<title>Thomas Kunnumpurath - TKTheTechie</title>

		<!--
			Resolve the theme before first paint. Without this the page renders
			light, then snaps to dark once the store initialises on mount.
		-->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
